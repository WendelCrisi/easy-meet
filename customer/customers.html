<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy Meet</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      .fab {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      }

      .sidebar-link.active {
        background-color: #e9ecef;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-3 d-flex justify-content-between">
      <div class="d-flex align-items-center">
        <button
          class="btn btn-dark d-md-none"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#sidebarMenu"
        >
          <i class="bi bi-list fs-4"></i>
        </button>
        <span class="navbar-brand mb-0 h1 ms-2">Easy Meet</span>
      </div>

      <div class="d-flex align-items-center gap-3">
        <span id="nome-usuario-logado" class="text-white small"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </nav>

    <div class="d-flex">
      <div
        class="d-none d-md-flex flex-column bg-light border-end p-3"
        style="width: 220px; min-height: calc(100vh - 56px)"
      >
        <a
          href="../meeting/meetings.html"
          class="sidebar-link d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
        >
          <i class="bi bi-camera-video"></i> Reuniões
        </a>
        <a
          href="customers.html"
          class="sidebar-link active d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
        >
          <i class="bi bi-people"></i> Clientes
        </a>
        <a
          href="../user/users.html"
          class="sidebar-link d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
        >
          <i class="bi bi-person-badge"></i> Usuários
        </a>
      </div>

      <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title">Menu</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
          ></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
          <a
            href="../meeting/meetings.html"
            class="d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
          >
            <i class="bi bi-camera-video"></i> Reuniões
          </a>
          <a
            href="customers.html"
            class="active d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
          >
            <i class="bi bi-people"></i> Clientes
          </a>
          <a
            href="../user/users.html"
            class="d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
          >
            <i class="bi bi-person-badge"></i> Usuários
          </a>
        </div>
      </div>

      <div class="flex-grow-1 p-3 position-relative">
        <h4 class="mb-3">Clientes</h4>

        <div class="mb-3" style="max-width: 320px">
          <input
            type="text"
            id="busca-name"
            class="form-control"
            placeholder="Buscar por nome"
          />
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Empresa</th>
                <th class="text-end">Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-clientes"></tbody>
          </table>
        </div>

        <a
          href="createcustomer.html"
          class="btn btn-primary fab"
          title="Novo cliente"
        >
          <i class="bi bi-plus"></i>
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/customer/customers.js"></script>
  </body>
</html>
