<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy Meet</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-light">
    <div class="d-flex justify-content-center align-items-center vh-100">
      <div class="card shadow-sm p-4" style="width: 320px">
        <div class="card-body text-center">
          <img src="logo.png" alt="Logo Easy Meet" class="mb-3" width="100" />
          <h2 class="mb-4">Easy Meet</h2>

          <div class="mb-3 text-start">
            <input
              type="text"
              id="user"
              class="form-control"
              placeholder="Usuário"
            />
          </div>

          <div class="mb-2 text-start">
            <div class="input-group">
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Senha"
              />
              <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="togglePassword()"
              >
                <i id="toggle-icon" class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <p id="mensagem-erro" class="text-danger small mb-3"></p>

          <button class="btn btn-primary w-100" onclick="fazerLogin()">
            Entrar
          </button>
        </div>
      </div>
    </div>

    <script src="scripts/auth.js"></script>
    <script src="scripts/login.js"></script>
  </body>
</html>
