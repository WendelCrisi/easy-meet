<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy Meet</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      .sidebar-link.active {
        background-color: #e9ecef;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-3">
      <button
        class="btn btn-dark d-md-none"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#sidebarMenu"
      >
        <i class="bi bi-list fs-4"></i>
      </button>
      <span class="navbar-brand mb-0 h1 ms-2">Easy Meet</span>
    </nav>

    <div class="d-flex">
      <div
        class="d-none d-md-flex flex-column bg-light border-end p-3"
        style="width: 220px; min-height: calc(100vh - 56px)"
      >
        <a
          href="meetings.html"
          class="sidebar-link active d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
        >
          <i class="bi bi-camera-video"></i> Reuniões
        </a>
        <a
          href="../customer/customers.html"
          class="sidebar-link d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
        >
          <i class="bi bi-people"></i> Clientes
        </a>
        <a
          href="../user/users.html"
          class="sidebar-link d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
        >
          <i class="bi bi-person-badge"></i> Usuários
        </a>
      </div>

      <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title">Menu</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
          ></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
          <a
            href="meetings.html"
            class="active d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
          >
            <i class="bi bi-camera-video"></i> Reuniões
          </a>
          <a
            href="../customer/customers.html"
            class="d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
          >
            <i class="bi bi-people"></i> Clientes
          </a>
          <a
            href="../user/users.html"
            class="d-flex align-items-center gap-2 text-decoration-none text-dark p-2 rounded mb-1"
          >
            <i class="bi bi-person-badge"></i> Usuários
          </a>
        </div>
      </div>

      <div class="flex-grow-1 p-3">
        <h4 class="mb-4">Nova reunião</h4>

        <div class="card shadow-sm" style="max-width: 420px">
          <div class="card-body">
            <div class="mb-3">
              <label for="companyname" class="form-label">
                Nome da empresa <span class="text-danger">*</span>
              </label>

              <select id="companyname" class="form-select" required>
                <option value="" selected disabled>
                  Carregando empresas...
                </option>
              </select>
            </div>

            <div class="mb-3">
              <label for="meetingdate" class="form-label">
                Data e hora <span class="text-danger">*</span>
              </label>

              <input
                type="datetime-local"
                id="meetingdate"
                class="form-control"
                required
              />
            </div>

            <div class="mb-3">
              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="online"
                />

                <label class="form-check-label" for="online">
                  Reunião online
                </label>
              </div>
            </div>

            <div class="mb-3 d-none" id="campo-link">
              <label for="link" class="form-label"> Link da reunião </label>

              <input
                type="text"
                id="link"
                class="form-control"
                placeholder="https://..."
              />
            </div>

            <div class="mb-3">
              <label for="observacao" class="form-label"> Observação </label>

              <textarea
                id="observacao"
                class="form-control"
                rows="4"
                placeholder="Digite uma observação..."
              ></textarea>
            </div>

            <p id="mensagem-erro" class="text-danger small mb-3"></p>
            <p id="mensagem-sucesso" class="text-success small mb-3"></p>

            <div class="d-flex gap-2">
              <button class="btn btn-primary" onclick="criarReuniao()">
                Salvar
              </button>
              <a href="meetings.html" class="btn btn-outline-secondary">
                Voltar
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/meeting/createmeeting.js"></script>
  </body>
</html>
